# Server Configuration
server.port=8080
spring.application.name=patient-log-level-management

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ss11_medical_db
spring.datasource.username=postgres
spring.datasource.password=190106
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# LOGGING CONFIGURATION (Yêu cầu bài tập 2)
# ===================================================================
# 1. Log của toàn bộ ứng dụng ở mức INFO
logging.level.root=INFO

# 2. Log của Hibernate/JPA ở mức DEBUG (để xem câu lệnh SQL gửi xuống Database)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# 3. Log của package com.medical.service ở mức TRACE
logging.level.com.medical.service=TRACE
